<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Catalog Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<script type="module" src="./app.ts"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    min-height: 100vh;
  }

  body {
    font-family: 'Roboto', Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    background: linear-gradient(135deg, #066fd1 0%, #0096ff 100%);
    color: #333;
    padding: 1.5rem;
  }

  .container {
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: #066fd1;
    margin-bottom: 1.5rem;
    letter-spacing: -0.5px;
  }

  h2 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.3rem;
    font-weight: 600;
    color: #333;
    margin-bottom: 1rem;
  }

  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 2px solid #e0e0e0;
  }

  .tab {
    padding: 0.75rem 1.5rem;
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: #666;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab:hover {
    color: #066fd1;
  }

  .tab.active {
    color: #066fd1;
    border-bottom-color: #066fd1;
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  .search-box {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid #e0e0e0;
    border-radius: 6px;
    font-family: 'Roboto', sans-serif;
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
    transition: border-color 0.2s;
  }

  .search-box:focus {
    outline: none;
    border-color: #066fd1;
  }

  .server-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .server-card {
    background: #f8f9fa;
    border: 2px solid #e0e0e0;
    border-radius: 6px;
    padding: 1rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .server-card:hover {
    border-color: #066fd1;
    box-shadow: 0 2px 8px rgba(6, 111, 209, 0.15);
  }

  .server-card.selected {
    border-color: #066fd1;
    background: #e3f2fd;
  }

  .server-name {
    font-weight: 600;
    color: #066fd1;
    margin-bottom: 0.5rem;
    font-size: 1rem;
  }

  .server-description {
    font-size: 0.85rem;
    color: #666;
    line-height: 1.4;
    margin-bottom: 0.5rem;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .server-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }

  .tag {
    padding: 0.2rem 0.5rem;
    background: #e0e0e0;
    border-radius: 3px;
    font-size: 0.75rem;
    color: #555;
  }

  .profile-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .profile-item {
    background: #f8f9fa;
    border: 2px solid #e0e0e0;
    border-radius: 6px;
    padding: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .profile-info {
    flex: 1;
  }

  .profile-name {
    font-weight: 600;
    color: #066fd1;
    font-size: 1rem;
    margin-bottom: 0.3rem;
  }

  .profile-meta {
    font-size: 0.85rem;
    color: #666;
  }

  .profile-actions {
    display: flex;
    gap: 0.5rem;
  }

  .btn {
    padding: 0.5rem 1rem;
    background: #066fd1;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    font-family: 'Roboto', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn:hover {
    background: #0557a8;
  }

  .btn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .btn-secondary {
    background: #666;
  }

  .btn-secondary:hover {
    background: #555;
  }

  .btn-danger {
    background: #d32f2f;
  }

  .btn-danger:hover {
    background: #b71c1c;
  }

  .btn-small {
    padding: 0.4rem 0.8rem;
    font-size: 0.85rem;
  }

  .message {
    padding: 0.75rem;
    border-radius: 4px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }

  .message.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }

  .message.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }

  .message.info {
    background: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
  }

  .hidden {
    display: none;
  }

  .loading {
    text-align: center;
    padding: 2rem;
    color: #666;
  }

  .spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #066fd1;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background: white;
    border-radius: 8px;
    padding: 2rem;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #666;
  }

  .form-group {
    margin-bottom: 1rem;
  }

  .form-label {
    display: block;
    font-weight: 500;
    margin-bottom: 0.5rem;
    color: #333;
  }

  .form-input {
    width: 100%;
    padding: 0.5rem;
    border: 2px solid #e0e0e0;
    border-radius: 4px;
    font-family: 'Roboto', sans-serif;
    font-size: 0.9rem;
  }

  .form-input:focus {
    outline: none;
    border-color: #066fd1;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: #666;
  }

  .empty-state-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>MCP Catalog Browser</h1>

    <div id="message" class="message hidden"></div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('catalog')">Browse Catalog</button>
      <button class="tab" onclick="switchTab('profiles')">Manage Profiles</button>
    </div>

    <!-- Catalog Tab -->
    <div id="catalog-tab" class="tab-content active">
      <input type="text" class="search-box" id="catalog-search" placeholder="Search servers..." oninput="filterCatalog()">
      <div id="catalog-loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Loading catalog...</p>
      </div>
      <div id="catalog-grid" class="server-grid"></div>
      <div id="catalog-empty" class="empty-state hidden">
        <div class="empty-state-icon">🔍</div>
        <p>No servers found</p>
      </div>
    </div>

    <!-- Profiles Tab -->
    <div id="profiles-tab" class="tab-content">
      <button class="btn" onclick="showCreateProfileModal()" style="margin-bottom: 1rem;">Create New Profile</button>
      <div id="profiles-loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Loading profiles...</p>
      </div>
      <div id="profiles-list" class="profile-list"></div>
      <div id="profiles-empty" class="empty-state hidden">
        <div class="empty-state-icon">📋</div>
        <p>No profiles yet. Create one to get started!</p>
      </div>
    </div>
  </div>

  <!-- Server Detail Modal -->
  <div id="server-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="server-modal-title">Server Details</h2>
        <button class="modal-close" onclick="closeModal('server-modal')">&times;</button>
      </div>
      <div id="server-modal-body"></div>
    </div>
  </div>

  <!-- Create Profile Modal -->
  <div id="create-profile-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create Profile</h2>
        <button class="modal-close" onclick="closeModal('create-profile-modal')">&times;</button>
      </div>
      <div class="form-group">
        <label class="form-label">Profile Name</label>
        <input type="text" id="new-profile-name" class="form-input" placeholder="my-profile">
      </div>
      <button class="btn" onclick="createProfile()">Create Profile</button>
    </div>
  </div>
</body>
</html>
